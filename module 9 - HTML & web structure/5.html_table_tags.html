<!-- 
**Rows** go left to right (horizontal).
**Columns** go top to bottom (vertical).

Think of a spreadsheet:
- Row 1: A1, B1, C1
- Column 1: A1, A2, A3

| Column 1 | Column 2 | Column 3 |
|----------|----------|----------|
| Row 1    | Row 1    | Row 1    |
| Row 2    | Row 2    | Row 2    |
| Row 3    | Row 3    | Row 3    | -->
