<html>
    <head>
        <link rel="stylesheet" href="9.cursor_properties.css">
    </head>

    <body>
            <p style="cursor: alias;">alias Value</p>
            <p style="cursor: auto;">auto Value</p>
            <p style="cursor: all-scroll;">all-scroll value</p>
            <p style="cursor: col-resize;">col-resize value</p>
            <p style="cursor: crosshair;">Crosshair</p>
            <p style="cursor: default;">Default value</p>
            <p style="cursor: pointer;">pointer</p>
            <p style="cursor: move;">Move</p>
            <p style="cursor: copy;">Copy</p>
            <p style="cursor: e-resize;">e-resize</p>
            <p style="cursor: ew-resize;">ew-resize</p>
            <p style="cursor: ne-resize;">ne-resize</p>
            <p style="cursor: nw-resize;">nw-resize</p>
            <!-- extras -->
            <div style="cursor: n-resize;">n-resize</div>
            <div style="cursor: se-resize;">se-resize</div>
            <div style="cursor: sw-resize;">sw-resize</div>
            <div style="cursor: s-resize;">s-resize</div>
            <div style="cursor: w-resize;">w-resize</div>
            <div style="cursor: text;">text</div>
            <div style="cursor: wait;">wait</div>
            <div style="cursor: help;">help</div>
            <div style="cursor: progress;">pregress</div>
            <div style="cursor: no-drop;">no-drop</div>
            <div style="cursor: not-allowed;">no-allowed</div>
            <div style="cursor: vertical-text;">vertical-text</div>
            <div style="cursor: zoom-in;">zoom-in</div>
            <div style="cursor: zoom-out;">zoom-out</div>

    </body>
</html>
